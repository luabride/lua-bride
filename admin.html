<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lua Bride 관리자</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <div id="loginGate" class="login-gate">
    <form id="loginForm" class="login-card">
      <p class="eyebrow">LUA BRIDE ADMIN</p>
      <h1>관리자 로그인</h1>
      <p>Firebase Authentication에 등록한 관리자 계정으로 로그인하세요.</p>
      <label>관리자 이메일
        <input id="adminEmail" type="email" autocomplete="username" placeholder="admin@luabride.com" required>
      </label>
      <label>비밀번호
        <input id="adminPassword" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary" type="submit">로그인</button>
      <div id="loginError" class="result"></div>
    </form>
  </div>

  <div id="adminApp" hidden>
    <header class="admin-header">
      <a class="brand" href="index.html"><span>☾</span><b>Lua Bride</b><small>ADMIN CONSOLE</small></a>
      <div class="admin-actions">
        <span id="storageBadge" class="badge"></span>
        <button id="logoutBtn" class="secondary small">로그아웃</button>
        <a class="primary small" href="index.html">홈페이지 보기</a>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-title">
        <div>
          <p class="eyebrow">LUA BRIDE MANAGEMENT</p>
          <h1>운영 관리자</h1>
          <p>예약과 고객 상담 이력을 한곳에서 관리합니다.</p>
        </div>
      </div>

      <nav class="admin-tabs">
        <button class="admin-tab active" data-tab="reservations">예약관리</button>
        <button class="admin-tab" data-tab="customers">고객관리</button>
      </nav>

      <section id="reservationsTab" class="admin-tab-panel">
        <section class="stats">
          <article><span>전체 예약</span><b id="totalCount">0</b></article>
          <article><span>신청</span><b id="pendingCount">0</b></article>
          <article><span>확정</span><b id="confirmedCount">0</b></article>
          <article><span>오늘 예약</span><b id="todayCount">0</b></article>
        </section>

        <section class="admin-panel">
          <div class="filters">
            <input id="searchInput" placeholder="이름·연락처·예약번호 검색">
            <select id="statusFilter">
              <option value="">모든 상태</option>
              <option>신청</option><option>확정</option><option>완료</option><option>취소</option>
            </select>
            <input id="dateFilter" type="date">
            <button id="clearFilter" class="secondary small">초기화</button>
            <button id="exportBtn" class="secondary small">예약 CSV</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>예약일시</th><th>고객</th><th>방문 목적</th><th>예식일</th><th>상태</th><th>관리</th></tr></thead>
              <tbody id="reservationRows"></tbody>
            </table>
            <div id="emptyState" class="empty">아직 저장된 예약이 없습니다.</div>
          </div>
        </section>
      </section>

      <section id="customersTab" class="admin-tab-panel" hidden>
        <section class="stats">
          <article><span>전체 고객</span><b id="customerCount">0</b></article>
          <article><span>상담 진행</span><b id="consultingCount">0</b></article>
          <article><span>계약 고객</span><b id="contractCount">0</b></article>
          <article><span>예식 90일 이내</span><b id="weddingSoonCount">0</b></article>
        </section>

        <section class="admin-panel">
          <div class="filters">
            <input id="customerSearch" placeholder="고객명·연락처·예식장·메모 검색">
            <select id="customerStageFilter">
              <option value="">모든 단계</option>
              <option>신규</option><option>상담중</option><option>피팅중</option><option>계약완료</option><option>보류</option>
            </select>
            <button id="customerExportBtn" class="secondary small">고객 CSV</button>
          </div>

          <div class="customer-layout">
            <div class="customer-list" id="customerList"></div>
            <div class="customer-detail" id="customerDetail">
              <div class="empty">왼쪽에서 고객을 선택하세요.</div>
            </div>
          </div>
        </section>
      </section>

      <section class="integration-note">
        <h2>운영 상태</h2>
        <p id="modeNote"></p>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-service.js"></script>
  <script src="data-service.js"></script>
  <script src="admin.js"></script>
</body>
</html>
